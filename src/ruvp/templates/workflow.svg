<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .node { rx: 8; ry: 8; }
      .label { font-size: 13px; fill: #1e293b; font-weight: 600; }
      .edge-label { font-size: 11px; fill: #64748b; }
      .section-title { font-size: 16px; fill: #0f172a; font-weight: 700; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="520" fill="#f8fafc" rx="12"/>

  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-size="20" fill="#0f172a" font-weight="700">Vibe Coding 工作流</text>

  <!-- uvp 节点 -->
  <rect x="30" y="80" width="120" height="50" class="node" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="110" text-anchor="middle" class="label" fill="#1d4ed8">uvp</text>

  <!-- 项目目录节点 -->
  <rect x="250" y="60" width="160" height="100" class="node" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="330" y="85" text-anchor="middle" class="label" fill="#15803d">项目目录</text>
  <text x="330" y="105" text-anchor="middle" font-size="11" fill="#166534">docs/ADR/</text>
  <text x="330" y="120" text-anchor="middle" font-size="11" fill="#166534">docs/PRD/</text>
  <text x="330" y="135" text-anchor="middle" font-size="11" fill="#166534">src/ reference/</text>

  <!-- ADR 节点 -->
  <rect x="520" y="60" width="140" height="50" class="node" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="590" y="90" text-anchor="middle" class="label" fill="#92400e">ADR 文件</text>

  <!-- Obsidian 节点 -->
  <rect x="250" y="240" width="160" height="80" class="node" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="330" y="268" text-anchor="middle" class="label" fill="#6d28d9">Obsidian Vault</text>
  <text x="330" y="288" text-anchor="middle" font-size="11" fill="#5b21b6">Projects/</text>
  <text x="330" y="303" text-anchor="middle" font-size="11" fill="#5b21b6">AI-Conversations/</text>

  <!-- Cherry Studio 节点 -->
  <rect x="520" y="240" width="160" height="80" class="node" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="600" y="268" text-anchor="middle" class="label" fill="#9d174d">Cherry Studio</text>
  <text x="600" y="288" text-anchor="middle" font-size="11" fill="#831843">知识库/对话</text>
  <text x="600" y="303" text-anchor="middle" font-size="11" fill="#831843">论文笔记</text>

  <!-- 代码改进节点 -->
  <rect x="720" y="60" width="140" height="50" class="node" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
  <text x="790" y="90" text-anchor="middle" class="label" fill="#0e7490">代码改进</text>

  <!-- 连线: uvp init → 项目目录 -->
  <line x1="150" y1="105" x2="248" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="98" text-anchor="middle" class="edge-label">uvp init</text>

  <!-- 连线: 项目目录 → ADR -->
  <line x1="410" y1="85" x2="518" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="78" text-anchor="middle" class="edge-label">uvp adr</text>

  <!-- 连线: 项目目录 → Obsidian -->
  <line x1="330" y1="160" x2="330" y2="238" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="200" text-anchor="start" class="edge-label">uvp obsidian</text>

  <!-- 连线: Cherry Studio → Obsidian -->
  <line x1="520" y1="280" x2="412" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="466" y="273" text-anchor="middle" class="edge-label">导出笔记</text>

  <!-- 连线: Obsidian → ADR -->
  <path d="M 410 260 Q 480 200 518 95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="180" text-anchor="middle" class="edge-label">--from-obsidian</text>

  <!-- 连线: ADR → 代码改进 -->
  <line x1="660" y1="85" x2="718" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="78" text-anchor="middle" class="edge-label">AI 执行</text>

  <!-- 底部流程说明 -->
  <rect x="30" y="370" width="840" height="130" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="395" class="section-title">工作流步骤</text>

  <text x="50" y="420" font-size="12" fill="#334155">1. uvp init → 创建目录 + mkdocs.yml + ADR 模板</text>
  <text x="50" y="440" font-size="12" fill="#334155">2. docs/PRD/init.md → 编写需求 → AI 生成 PRD.md → 人工审阅</text>
  <text x="50" y="460" font-size="12" fill="#334155">3. uvp adr "标题" → 创建 ADR → mkdocs serve 预览</text>
  <text x="50" y="480" font-size="12" fill="#334155">4. 论文 → Cherry Studio 知识库 → 对话提炼 → 导出笔记到 Obsidian → uvp adr --from-obsidian → AI 执行</text>
</svg>
