name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_DIR: src/ruvp

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: uvp-windows-x86_64.exe
            binary: uvp.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: uvp-macos-aarch64
            binary: uvp

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_DIR }}/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('src/ruvp/Cargo.lock', 'src/ruvp/Cargo.toml') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --manifest-path ${{ env.CARGO_DIR }}/Cargo.toml --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "${{ env.CARGO_DIR }}/target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(grep '^version' src/ruvp/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/uvp-windows-x86_64.exe/uvp-windows-x86_64.exe release/
          cp artifacts/uvp-macos-aarch64/uvp-macos-aarch64 release/
          chmod +x release/uvp-macos-aarch64
          cp scripts/install.sh release/
          cp scripts/install.ps1 release/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
